# Link checker config. Run locally with `lychee --config lychee.toml .`
# or let CI run it (.github/workflows/lint.yml).
cache = true
max_cache_age = "7d"
timeout = 20
max_retries = 2
# 429: rate limiting is not link rot.
accept = ["200..=299", "429"]
# Excluded hosts return 403 to non-browser clients (bot protection), so the
# checker cannot see what a reader sees. Links to them are verified manually
# at draft time, per the review flow in CONTRIBUTING.md.
exclude = ["^mailto:", "^https://eprint\\.iacr\\.org", "^https://papers\\.ssrn\\.com", "^https://medium\\.com"]
